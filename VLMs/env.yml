name: saturn
channels:
  - conda-forge
  - nvidia
  - pytorch
  - defaults
dependencies:
  - python=3.10
  - pytorch=2.1.0
  - pytorch-cuda=12.1
  - torchvision=0.16.0
  - torchaudio=2.1.0
  - einops
  - jupyterlab
  - ipykernel
  - ipywidgets
  - matplotlib
  - numpy
  - scipy
  - scikit-image
  - pip
  - pip:
      - deepspeed==0.16.2
      - transformers==4.46.3
      - peft==0.4.0
      - sentencepiece==0.2.0
      - wandb==0.19.1

prefix: /opt/saturncloud/envs/saturn
